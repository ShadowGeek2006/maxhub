# Render Blueprint — deploys the backend API + a managed Postgres database.
# Import this repo on Render (New > Blueprint) and it provisions both.
#
# Why Postgres and not the SQLite used in local dev: most hosts, including
# Render's free web service tier, don't give a running instance a real
# persistent disk — the filesystem resets on every redeploy/restart, which
# would silently wipe all orders. Postgres is a managed, persistent service
# instead. This follows the backend's own schema.prisma comment ("swap to
# postgresql + a DATABASE_URL when moving to production without touching
# any application code") — no application code changes needed, only the
# `provider` line in prisma/schema.prisma and the DATABASE_URL env var.

databases:
  - name: max-pizza-hub-db
    plan: free
    databaseName: maxpizzahub
    user: maxpizzahub

services:
  - type: web
    name: max-pizza-hub-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: max-pizza-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        value: https://REPLACE-WITH-YOUR-VERCEL-DOMAIN.vercel.app
